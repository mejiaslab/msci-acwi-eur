name: Actualizar Datos y Desplegar GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Lunes a viernes tras cierre europeo (XETRA) y tras cierre global/EE. UU. (MSCI EOD)
    - cron: "20 17 * * 1-5"
    - cron: "35 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: "pages-and-data"
  cancel-in-progress: false

jobs:
  update-data:
    name: Actualizar histórico MSCI ACWI EUR
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar actualización de datos
        run: python3 scripts/update_data.py

      - name: Guardar y subir cambios si hay nuevos datos
        run: |
          if [[ -n "$(git status --porcelain data/msci_acwi_eur.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/msci_acwi_eur.json
            git commit -m "chore(data): actualizar datos MSCI ACWI EUR ($(date -u +'%Y-%m-%d'))"
            git push origin HEAD:main
          else
            echo "Sin cambios en data/msci_acwi_eur.json"
          fi

  deploy-pages:
    name: Publicar en GitHub Pages
    needs: [update-data]
    if: always() && (github.event_name == 'push' || needs.update-data.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout rama main actualizada
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar artefacto estático
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js favicon.svg _site/
          cp data/msci_acwi_eur.json _site/data/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
